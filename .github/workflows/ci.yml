name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m compileall -q colorMat.py data eval.py eval_multipro.py mit_semseg scripts test.py train.py
      - run: python -m unittest discover -s tests -v
